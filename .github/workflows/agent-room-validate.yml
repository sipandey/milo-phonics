name: agent-room-validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - name: Install application dependencies
        run: npm ci
      - name: Lint TypeScript source
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      # Pinned to the create-agent-room version active when this workflow was
      # scaffolded, so CI results stay reproducible across runs. To pick up
      # fixes from a newer release, re-run `create-agent-room init --force`
      # (or bump the version below by hand) and commit the change.
      #
      # Installed explicitly rather than run via `npx --yes pkg@version cmd`:
      # npx's temporary-install/exec-resolution path has been observed to
      # fail intermittently on GitHub-hosted runners ("sh: 1: create-agent-room:
      # not found", even though the package installed correctly) - a global
      # install + direct invocation sidesteps that machinery entirely.
      - name: Install create-agent-room@2.3.1
        run: npm install -g create-agent-room@2.3.1
      - name: Validate phonics agent-room structure
        run: create-agent-room validate .
      # The archive contains older session records outside the current schema.
      # Keep this gate strict for new/changed records without rewriting history.
      - name: Lint changed session logs
        env:
          SESSION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          session_dir="$temp_dir/.agent-room/sessions"
          mkdir -p "$session_dir"

          if [[ -z "$SESSION_BASE_SHA" || "$SESSION_BASE_SHA" =~ ^0+$ ]]; then
            mapfile -t session_files < <(find .agent-room/sessions -maxdepth 1 -type f \( -name '*.md' -o -name '*.json' \) -print)
          else
            mapfile -t session_files < <(git diff --name-only --diff-filter=ACMRT "$SESSION_BASE_SHA" "$GITHUB_SHA" -- .agent-room/sessions)
          fi

          for file in "${session_files[@]}"; do
            [[ "$file" == *.md || "$file" == *.json ]] || continue
            [[ -f "$file" ]] || continue
            cp "$file" "$session_dir/"
          done

          if [[ -z "$(find "$session_dir" -type f -print -quit)" ]]; then
            echo "No session logs changed; existing legacy log debt is left untouched."
            exit 0
          fi

          create-agent-room lint-sessions "$temp_dir"
      - name: Run compliance evals
        run: create-agent-room eval
